# Inventory of the Duolingo Math course as shown in the app's Grades view.
#
# Only names, grouping, and order are stored, transcribed as text from the
# app. No screenshots, exercises, or other app content are stored in this
# repository. Unit and lesson names are reproduced for the purpose of
# reference and commentary.
#
# Structure: grades -> units and topics -> units, each list in the order the
# app displays it. `order` is written explicitly so reordering shows in a
# diff. Identifiers are assigned once and never renumbered: grade units
# u-g<grade>-<nn>, topic units u-t<abbr>-<nn>. `unit_count` is the total the
# app shows for the grade or topic (the "n / n" progress bar), so a partially
# transcribed list is detectable. The nodes inside a unit are unnamed
# practice steps in the app, so the unit is the finest grain recorded.
#
# The app's Topics tab is a second path of units with their own names,
# distinct from the grade units; it is recorded under `topics` with each
# topic's unit total and ids u-t<abbr>-<nn>. "Daily Refresh" appears at the end
# of both tabs but is a review mode, not content, and is not recorded.

