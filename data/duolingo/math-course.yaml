# Inventory of the Duolingo Math course as shown in the app's Grades view.
#
# Only names, grouping, and order are stored, transcribed as text from the
# app. No screenshots, exercises, or other app content are stored in this
# repository. Unit and lesson names are reproduced for the purpose of
# reference and commentary.
#
# Structure: grades -> units -> lessons, each list in the order the app
# displays it. `order` is written explicitly so reordering shows in a diff.
# Identifiers are assigned once and never renumbered: units u-g<grade>-<nn>,
# lessons l-g<grade>-<nnn>. `unit_count` is the total the app shows for the
# grade (the "n / n" progress bar), so a partially transcribed grade is
# detectable. Lessons are added as each unit is opened in the app.
#
# The app's Topics tab is a second grouping of units; it is recorded under
# `topics` with each topic's unit total. "Daily Refresh" appears at the end
# of both tabs but is a review mode, not content, and is not recorded.

