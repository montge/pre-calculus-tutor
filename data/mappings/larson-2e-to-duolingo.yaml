    rating: prerequisite
    note: Degrees as parts of a full 360-degree turn, the basis of degree measure.
  - unit: u-g10-06
    rating: prerequisite
    note: Defines rotations of figures about a point, including direction, which previews counterclockwise
      versus clockwise but not angles in standard position.
  - unit: u-g10-08
    rating: prerequisite
    note: Turning figures clockwise, the direction a negative angle turns from the initial side.
