# Mapping from textbook sections to Duolingo Math units.
#
# One entry per numbered section of Larson, Precalculus with Limits, 2nd ed.
# `units` lists the Duolingo units to practise for that section, in
# recommended order, each with a coverage rating (full, partial,
# prerequisite) and a note. `gaps` lists the parts of the section that
# Duolingo does not cover (book only); the study guides teach exactly
# those. `reviewed: false`
# marks a draft; outputs label such sections as draft.
#
# Only titles, identifiers, and commentary are stored here. No textbook or
# Duolingo content is reproduced.

textbook: larson-precalculus-with-limits-2e
duolingo: duolingo-math
chapters:
- number: 1
  summary: Grade 9 carries the basics (functions, lines, transformations), grade 11 repeats them at precalculus
    depth, and the Algebraic Graphing topic is a condensed walk through the whole chapter. Follow grade
    11 if you only have time for one lane.
- number: 2
  summary: Grades 11 and 12 between them cover polynomial, complex, and rational functions thoroughly.
    Duolingo has no unit on polynomial long or synthetic division (2.3) or on nonlinear inequalities (2.7);
    use the book for those.
- number: 3
  summary: Grade 11 covers exponentials and logarithms almost section by section. Duolingo stops at growth
    and decay, so the Gaussian, logistic, and logarithmic models of 3.5 come from the book only.
sections:
- section: '1.1'
  reviewed: false
  note: Distance and midpoint are covered in grade 10. Plotting is a lower-grade prerequisite. The section's
    data applications are book only.
  gaps:
  - Translating points in the plane
  - Applications of the distance and midpoint formulas
