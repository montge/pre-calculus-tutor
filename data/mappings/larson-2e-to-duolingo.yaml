  note: Duolingo has no unit on standard position, coterminal angles, radians, arc length, angular speed
    or sectors, so most of this section is book only. The grade 7 complementary and supplementary units
    practise that skill in degrees, with the Geometry topic's Angle relationships as the Topics-tab alternative.
    The angle, rotation, quadrant, fraction, factor, circle, conversion, time and rate units are warm-ups
    for the section's definitions and formulas.
  gaps:
  - 'Angles in standard position: vertex, initial side, terminal side'
  - Positive (counterclockwise) and negative (clockwise) angles
  - Angles beyond one full revolution
  - Quadrant of an angle's terminal side
  - Coterminal angles in degrees and radians
  - Definition of radian measure (arc length over radius)
  - Radian measures of common angles and quadrant boundaries
  - Acute and obtuse angles in radians (0 to pi/2, pi/2 to pi)
  - Converting between degrees and radians
  - Degrees-minutes-seconds and decimal degrees
  - Complementary and supplementary angles in radians
  - Arc length formula s = r theta
  - Linear speed v = s/t, angular speed omega = theta/t, and v = r omega
  - Converting revolutions per minute to radians per minute
  - Area of a circular sector
  units:
